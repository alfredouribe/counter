<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conociendo a Karina</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="global-nav">Conociendo a Karina</nav>

    <main>
      <div class="hero">
        <p class="hero-tagline">Falta poco para conocer a Karina</p>
        <h1 class="hero-title">29 de Agosto</h1>
        <p class="hero-date">Sábado, 29 de agosto de 2026 · Alfred sale de casa a las 7:00 a.m.</p>

        <div class="countdown">
          <div class="countdown-unit">
            <div class="countdown-value" id="days">0</div>
            <div class="countdown-label">Días</div>
          </div>
          <div class="countdown-unit">
            <div class="countdown-value" id="hours">00</div>
            <div class="countdown-label">Horas</div>
          </div>
          <div class="countdown-unit">
            <div class="countdown-value" id="minutes">00</div>
            <div class="countdown-label">Minutos</div>
          </div>
          <div class="countdown-unit">
            <div class="countdown-value" id="seconds">00</div>
            <div class="countdown-label">Segundos</div>
          </div>
        </div>

        <div class="celebration">
          <p class="hero-complete">Ha llegado el momento, Karina</p>
          <p class="celebration-cta">Dale play a esto...</p>
          <audio class="celebration-audio" controls preload="none" src="casate.mp3"></audio>
          <div class="lyrics" id="lyrics"></div>
        </div>
      </div>
    </main>

    <footer>&copy; 2026 Alfred &amp; Karina</footer>

    <script src="script.js"></script>
  </body>
</html>
